backend:
  name: github
  repo: binaryu/emos-wiki
  branch: main
  base_url: https://auth.emos.dpdns.org
  auth_endpoint: auth
  open_authoring: true
  auth_scope: public_repo

publish_mode: editorial_workflow

output:
  omit_empty_optional_fields: true
media_folder: "static/img"
public_folder: "/img"

collections:
  - name: "docs"
    label: "文档"
    folder: "docs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - { label: "侧边栏显示名称", name: "sidebar_label", widget: "string", required: false }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", value_type: "int", required: false }
      - { label: "自定义路由 (Slug)", name: "slug", widget: "string", required: false, pattern: ['^($|/[a-zA-Z0-9\-_\/]*)$', '必须以 / 开头（例如 / 或 /carrot），或者留空'] }
      - { label: "页面描述", name: "description", widget: "string", required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
